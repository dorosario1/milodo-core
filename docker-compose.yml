services:
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web
    restart: unless-stopped

  milodo-api:
    container_name: milodo-api
    image: python:3.12-slim
    working_dir: /app
    command: python -c "import skills.api_server as s; s.HOST='0.0.0.0'; s.run_server()"
    ports:
      - "8520:8520"
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://milodo:milodo@db:5432/milodo
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8520"
    networks:
      - web
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Worker — Standby container (future distributed queue)
  # NOTE: queue.Queue() is process-local. Async jobs run
  # inside milodo-api. This container is kept as future infra
  # target for Redis/Valkey distributed workers.
  # ──────────────────────────────────────────────────────────
  milodo-worker:
    container_name: milodo-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    labels:
      - "org.milodo.mode=standby"
      - "org.milodo.future=redis-worker"
    networks:
      - web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: milodo
      POSTGRES_PASSWORD: milodo
      POSTGRES_DB: milodo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    name: web

volumes:
  postgres_data:
  redis_data:
