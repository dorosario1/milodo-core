<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Hybride</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Titre de la page</h1>
            <p>Ceci est un exemple de landing page hybride.</p>
            <button>Nous contacter</button>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="contact">
        <div class="container">
            <h2>Contactez-nous</h2>
            <ul>
                <li>Adresse 1</li>
                <li>Adresse 2</li>
                <li>Téléphone 1</li>
                <li>Téléphone 2</li>
                <li>Email 1</li>
                <li>Email 2</li>
            </ul>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <p>&copy; Année de publication</p>
            <ul>
                <li>Termes et conditions</li>
                <li>Politique de confidentialité</li>
            </ul>
        </div>
    </footer>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
