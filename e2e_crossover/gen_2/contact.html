<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site vitrine restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hero section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>Bonjour, nous sommes ravis de vous accueillir</h1>
                <img src="image.jpg" alt="Image d'acceuil">
            </div>
            <nav class="menu-hamburger">
                <button class="toggle">Menu</button>
                <ul class="menu-list">
                    <li><a href="#">À propos</a></li>
                    <li><a href="#">Menu</a></li>
                    <li><a href="#">Reservations</a></li>
                </ul>
            </nav>
        </div>
    </section>

    <!-- Contact section -->
    <section class="contact">
        <div class="container">
            <h2>Contactez-nous</h2>
            <form>
                <label for="name">Nom:</label>
                <input type="text" id="name" name="name"><br><br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"><br><br>
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea><br><br>
                <button type="submit">Envoyer</button>
            </form>
            <p>Adresse : Rue de la République, 12345 Paris</p>
            <p>Horaires : Lundi au vendredi de 12h à 22h, Samedi et dimanche de 13h à 21h</p>
            <img src="carte.jpg" alt="Carte du restaurant">
        </div>
    </section>

    <!-- Footer section -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 Restaurant Name</p>
            <ul class="social-links">
                <li><a href="#">Facebook</a></li>
                <li><a href="#">Instagram</a></li>
                <li><a href="#">Twitter</a></li>
            </ul>
        </div>
    </footer>

    <!-- CSS et scripts -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</body>
</html>
