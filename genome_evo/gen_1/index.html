<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Cycle</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Hero -->
    <section class="hero">
        <h1>Test</h1>
    </section>

    <!-- Features -->
    <section class="features">
        <div class="container">
            <h2>Nos fonctionnalités</h2>
            <ul>
                <li>
                    <i class="fas fa-lock"></i> Sécurité renforcée
                </li>
                <li>
                    <i class="fas fa-map-marker-alt"></i> Cartographie des parcours
                </li>
                <li>
                    <i class="fas fa-calendar-day"></i> Gestion de la maintenance
                </li>
            </ul>
        </div>
    </section>

    <!-- Pricing -->
    <section class="pricing">
        <h2>Prix</h2>
        <p>20€/mois</p>
        <button>Choisir mon plan</button>
    </section>

    <!-- CTA -->
    <section class="cta">
        <h2>Demain, nous roulerons ensemble</h2>
        <button>Reserver ton vélo</button>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 Auto Cycle. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="https://kit.fontawesome.com/your-favicon-url.js"></script>
</body>
</html>
