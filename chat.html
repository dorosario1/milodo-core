<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MILODO CHAT</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #263244;
      background: #0f172a;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: min(760px, 82%);
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .message.user {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
    }

    .message.milodo {
      align-self: flex-start;
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
    }

    .message.error {
      align-self: flex-start;
      background: #7f1d1d;
      color: #fee2e2;
      border: 1px solid #b91c1c;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #263244;
      background: #0f172a;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #374151;
      border-radius: 6px;
      background: #111827;
      color: #f9fafb;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #60a5fa;
    }

    input:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: #10b981;
      color: #052e1b;
      font-weight: 700;
      padding: 0 18px;
      font-size: 15px;
      cursor: pointer;
      min-width: 84px;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      #messages {
        padding: 14px;
      }

      .message {
        max-width: 92%;
      }

      form {
        padding: 12px;
      }

      button {
        min-width: 72px;
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>
  <header>MILODO CHAT</header>

  <main>
    <section id="messages" aria-live="polite"></section>

    <form id="chat-form">
      <input id="message-input" type="text" autocomplete="off" placeholder="Écrire un message..." required>
      <button id="send-button" type="submit">Send</button>
    </form>
  </main>

  <script>
    const API_URL = "http://127.0.0.1:8520/chat";
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const button = document.getElementById("send-button");
    const messages = document.getElementById("messages");

    function addMessage(text, type) {
      const item = document.createElement("div");
      item.className = `message ${type}`;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
      return item;
    }

    function setLoading(isLoading) {
      input.disabled = isLoading;
      button.disabled = isLoading;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) {
        return;
      }

      addMessage(text, "user");
      input.value = "";
      setLoading(true);

      const waitingMessage = addMessage("MILODO réfléchit...", "milodo");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: text })
        });

        if (!response.ok) {
          throw new Error(`Erreur serveur ${response.status}`);
        }

        const data = await response.json();
        waitingMessage.textContent = data.response || "Réponse vide.";
      } catch (error) {
        waitingMessage.remove();
        addMessage(`Erreur réseau: ${error.message}`, "error");
      } finally {
        setLoading(false);
        input.focus();
      }
    });
  </script>
</body>
</html>
