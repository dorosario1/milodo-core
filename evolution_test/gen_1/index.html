<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hero Section -->
    <header class="hero">
        <img src="image.jpg" alt="Image de fond">
        <div class="container">
            <h1>Titre du produit</h1>
            <p>Paragraphe de présentation</p>
            <button>Cliquez ici</button>
        </div>
    </header>

    <!-- Features Section -->
    <section class="features">
        <div class="container">
            <h2>Fonctionnalités</h2>
            <ul>
                <li><i class="fas fa-check"></i> Fonctionnalité 1</li>
                <li><i class="fas fa-check"></i> Fonctionnalité 2</li>
                <li><i class="fas fa-check"></i> Fonctionnalité 3</li>
            </ul>
        </div>
    </section>

    <!-- Pricing Section -->
    <section class="pricing">
        <div class="container">
            <h2>Pricing</h2>
            <table>
                <thead>
                    <tr>
                        <th>Plan</th>
                        <th>Prix</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Plan A</td>
                        <td>$9.99/mois</td>
                        <td>Description de plan A</td>
                    </tr>
                    <tr>
                        <td>Plan B</td>
                        <td>$19.99/mois</td>
                        <td>Description de plan B</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- CTA Section -->
    <section class="cta">
        <div class="container">
            <h2>Cliquez pour commencer</h2>
            <button>Commencez dès maintenant</button>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2023. Tous droits réservés.</p>
        </div>
    </footer>
</body>
</html>
