<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Hybride</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hero -->
    <section class="hero">
        <h1>Titre de la page</h1>
        <p>Description de la page</p>
        <button>Bouton de lancement</button>
    </section>

    <!-- Features -->
    <section class="features">
        <h2>Fonctionnalités</h2>
        <ul>
            <li>Funciton 1</li>
            <li>Funciton 2</li>
            <li>Funciton 3</li>
        </ul>
    </section>

    <!-- Pricing -->
    <section class="pricing">
        <h2>Tarifs</h2>
        <table>
            <tr>
                <th>Nom</th>
                <th>Prix</th>
            </tr>
            <tr>
                <td>Tarif 1</td>
                <td>20€/mois</td>
            </tr>
            <tr>
                <td>Tarif 2</td>
                <td>30€/mois</td>
            </tr>
        </table>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2023 Société</p>
        <ul>
            <li>Liens utiles</li>
            <li>Contact</li>
        </ul>
    </footer>

    <!-- Navigation -->
    <nav class="nav">
        <ul>
            <li><a href="#">Accueil</a></li>
            <li><a href="#">À propos</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Section cohérente -->
    <section class="coherente">
        <h2>Cohérence</h2>
        <p>Contenu cohérent et riche</p>
    </section>
</body>
</html>
