<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleTest</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hero fullscreen avec image background -->
    <section class="hero-fullscreen">
        <div class="container"></div>
        <h1>Batalla Test</h1>
    </section>

    <!-- Navigation latérale fixe -->
    <nav class="nav-laterale">
        <ul>
            <li><a href="#">Features</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">CTA</a></li>
        </ul>
    </nav>

    <!-- Section Features -->
    <section class="features">
        <div class="container">
            <h2>Features</h2>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            </ul>
        </div>
    </section>

    <!-- Section Pricing -->
    <section class="pricing">
        <div class="container">
            <h2>Pricing</h2>
            <table>
                <tr>
                    <th>Prix</th>
                    <th>Caractéristiques</th>
                </tr>
                <tr>
                    <td>50€/mois</td>
                    <td>Feature 1, Feature 2</td>
                </tr>
            </table>
        </div>
    </section>

    <!-- Section CTA -->
    <section class="cta">
        <div class="container">
            <h2>CTA</h2>
            <button>Signez-vous maintenant !</button>
        </div>
    </section>

</html>
